services:
  postgres:
    image: postgres:16-alpine
    container_name: pub_tips_postgres
    environment:
      POSTGRES_DB: pub_tips
      POSTGRES_USER: pub_admin
      POSTGRES_PASSWORD: pub_password
    ports:
      - "55432:5432"
    volumes:
      - pub_tips_data:/var/lib/postgresql/data

volumes:
  pub_tips_data:
